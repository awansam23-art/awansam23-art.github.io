<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{--bg:#F6F1FF;--ink:#24123F;--muted:#62547A;--accent:#6A35E0;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#160B2A;--ink:#F1EAFF;--muted:#B9AED0;--accent:#B99BFF;--card:#21133A}}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:40px 20px 64px}h1{font-size:30px;line-height:1.2;margin:0 0 6px}
h2{font-size:20px;margin:32px 0 6px}a{color:var(--accent)}p,li{color:var(--ink)}.muted{color:var(--muted)}
.card{background:var(--card);border-radius:20px;padding:28px;box-shadow:0 6px 30px rgba(60,20,120,.08)}
